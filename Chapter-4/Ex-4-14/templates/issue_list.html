<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issues</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- Header & Search Bar -->
        <div class="row align-items-center mb-4 g-3">
            <div class="col-md-6">
                <h1 class="h3 mb-0 fw-bold text-dark">{{.TotalCount}} issues</h1>
            </div>
            <div class="col-md-6">
                <form method="GET" action="/results" class="d-flex">
                    <input type="search" name="q" class="form-control me-2 shadow-sm" placeholder="Search issues..." aria-label="Search">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm">Search</button>
                </form>
            </div>
        </div>

        <!-- Issues Table -->
        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr class="text-start">
                            <th scope="col" class="ps-4">#</th>
                            <th scope="col">State</th>
                            <th scope="col">User</th>
                            <th scope="col" class="pe-4">Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range $i, $item := .Items}}
                        <tr>
                            <td class="ps-4 fw-medium">
                                <a href="{{.HTMLURL}}" class="text-decoration-none">{{.Number}}</a>
                            </td>
                            <td>
                                <span class="badge rounded-pill text-bg-secondary">{{.State}}</span>
                            </td>
                            <td>
                                <a href="{{.User.HTMLURL}}" class="text-decoration-none text-muted">@{{.User.Login}}</a>
                            </td>
                            <td class="pe-4">
                                <a href="/issue?id={{$i}}" class="text-decoration-none text-dark fw-medium">{{.Title}}</a>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
