<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#{{.Number}} - {{.Title}}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 900px;">
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="/" class="btn btn-sm btn-outline-secondary">&larr; Back to Search</a>
            <a href="{{.HTMLURL}}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">
                View Original &nearr;
            </a>
        </div>

        <!-- Issue Card -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-4 px-4 border-bottom">
                <h1 class="h4 fw-bold text-dark mb-2">
                    {{.Title}} <span class="text-muted fw-normal">#{{.Number}}</span>
                </h1>
                <div class="d-flex flex-wrap align-items-center gap-2 text-muted small">
                    <span class="badge rounded-pill text-bg-secondary">{{.State}}</span>
                    {{if .User}}
                    <span>
                        opened by <a href="{{.User.HTMLURL}}" class="text-decoration-none fw-medium text-dark">@{{.User.Login}}</a>
                    </span>
                    {{end}}
                    <span>&middot;</span>
                    <span>{{.CreatedAt.Format "Jan 2, 2006"}}</span>
                </div>
            </div>

            <div class="card-body p-4">
                {{if .Body}}
                <div style="white-space: pre-wrap;">{{.Body}}</div>
                {{else}}
                <p class="text-muted fst-italic mb-0">No description provided.</p>
                {{end}}
            </div>
        </div>
    </div>

</body>
</html>
