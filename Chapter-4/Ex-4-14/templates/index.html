<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Issues</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center px-3">
        <div class="w-100" style="max-width: 640px;">
            <form method="GET" action="/results" class="d-flex gap-2">
                <input type="search" name="q" class="form-control form-control-lg shadow-sm" placeholder="Search issues..." aria-label="Search" autofocus>
                <button type="submit" class="btn btn-primary btn-lg px-4 shadow-sm">Search</button>
            </form>
        </div>
    </div>

</body>
</html>
